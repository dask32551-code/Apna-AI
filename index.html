<style>
:root{
  --bg:#faf8f5;--panel:#f1eee8;--text:#292722;--muted:#817b72;--line:#e6e0d7;
  --accent:#111111;--bubble:#f0ece5;--brand:#111111;--brand-h:#000000;
  --success:#3d8b6e;--danger:#c45c4e;--code-bg:#1e1d1b;--shadow:#00000012;
  --radius:16px;--font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#1a1a18;--panel:#2b2a27;--text:#f3efe8;--muted:#aaa49a;--line:#3d3c38;
  --accent:#f2f2f2;--bubble:#2f2e2b;--brand:#f2f2f2;--brand-h:#ffffff;
  --success:#5cb88a;--danger:#e07a6e;--code-bg:#141312;--shadow:#0006;
}
[data-theme="dark"] .newchat,[data-theme="dark"] .send,[data-theme="dark"] .primary,[data-theme="dark"] .codehead .run-btn,[data-theme="dark"] #micBtn.listening,[data-theme="dark"] .newchat .ic,[data-theme="dark"] .logo,[data-theme="dark"] .welcome .biglogo{color:#000}
*{box-sizing:border-box;margin:0}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#3a3a3a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 2px 8px #00000033}
.brand{font-size:16px;font-weight:700;flex:1;line-height:1.2}
.brand .sub{font-size:11px;color:var(--muted);font-weight:500}
.iconbtn{min-width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px;border-radius:12px;background:transparent;border-color:transparent}
.iconbtn:hover{background:var(--panel);border-color:var(--line)}
.layout{display:flex;min-height:0;flex:1;position:relative}
.sidebar{width:260px;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);flex-shrink:0;z-index:4}
.newchat{width:100%;text-align:left;font-weight:600;background:var(--brand);color:#fff;border-color:var(--brand);border-radius:12px}
.newchat:hover{background:var(--brand-h);border-color:var(--brand-h)}
.search-box{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:0;color:var(--text)}
.search-box:focus{border-color:var(--brand)}
.history{overflow:auto;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.history-item{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px}
.history-item button.chat-btn{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-size:13.5px}
.history-item button.chat-btn.active,.history-item button.chat-btn:hover{background:var(--panel)}
.history-item .del{opacity:0;background:transparent;border:0;padding:6px;font-size:12px;color:var(--muted);border-radius:8px}
.history-item:hover .del{opacity:1}
.history-item .del:hover{color:var(--danger);background:var(--panel)}
.sidebar-foot{font-size:11px;color:var(--muted);padding:6px 4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.chat{flex:1;overflow:auto;padding:20px 16px 12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.welcome{max-width:560px;margin:8vh auto 0;text-align:center;animation:fadeUp .4s ease}
.welcome .biglogo{margin:0 auto 18px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--brand),#3a3a3a);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 4px 16px #00000044}
.welcome h1{font-size:26px;margin:0 0 6px;font-weight:700}
.welcome p{color:var(--muted);margin:0 0 22px;font-size:15px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.suggestions button{text-align:left;background:var(--bg);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.35;transition:all .15s}
.suggestions button:hover{border-color:var(--brand);background:var(--panel);transform:translateY(-1px)}
.message{max-width:780px;margin:0 auto 20px;display:flex;gap:10px;align-items:flex-start;animation:fadeUp .25s ease}
.avatar{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel);font-size:11px;font-weight:700;margin-top:2px}
.message.assistant .avatar{background:linear-gradient(135deg,var(--brand),#3a3a3a);color:#fff}
.content{min-width:0;flex:1;padding-top:2px;overflow-wrap:anywhere}
.content img.gen{max-width:100%;border-radius:14px;margin-top:10px;border:1px solid var(--line)}
.message.user{justify-content:flex-end}
.message.user .content{background:var(--bubble);border-radius:18px 18px 6px 18px;padding:10px 14px;flex:0 1 auto;max-width:85%;white-space:pre-wrap}
.message.user .avatar{order:2}
.message.assistant .content{white-space:normal}
.msg-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}
.message:hover .msg-actions,.message:focus-within .msg-actions{opacity:1}
.msg-actions button{font-size:11px;padding:4px 8px;border-radius:8px;background:transparent;border-color:transparent;color:var(--muted)}
.msg-actions button:hover{background:var(--panel);color:var(--text);border-color:var(--line)}
.md{line-height:1.55}
.md p{margin:0 0 .7em}
.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-weight:700;margin:1em 0 .4em;line-height:1.3}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.08em}
.md ul,.md ol{margin:.4em 0 .7em;padding-left:1.4em}
.md li{margin:.2em 0}
.md blockquote{border-left:3px solid var(--brand);margin:.6em 0;padding:.3em 0 .3em 12px;color:var(--muted)}
.md a{color:var(--brand);text-decoration:underline}
.md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:14px;overflow-x:auto;display:block}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.md th{background:var(--panel);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md code{background:var(--panel);padding:1px 5px;border-radius:5px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md strong{font-weight:700}
.md em{font-style:italic}
.codeblock{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg);color:#f3efe8}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#2b2a27;font-size:12px;color:#aaa49a}
.codehead span.lang{font-weight:500;text-transform:uppercase;letter-spacing:.03em;font-size:11px}
.codehead button{background:transparent;border:1px solid #55524b;color:#f3efe8;border-radius:7px;padding:3px 9px;margin-left:5px;font-size:11px}
.codehead button:hover{background:#3a3935}
.codeblock pre{margin:0;padding:12px 14px;overflow:auto;max-height:480px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codeblock code{background:none;padding:0;color:inherit}
.t-c{color:#8d8a80;font-style:italic}.t-s{color:#a5d6a7}.t-n{color:#d0d0d0}.t-k{color:#ffffff;font-weight:600}.t-t{color:#8ab4f8}
.cursor{display:inline-block;width:7px;height:1em;background:var(--brand);margin-left:2px;vertical-align:text-bottom;animation:blink .7s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.composer-wrap{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer{max-width:780px;margin:0 auto;border:1px solid var(--line);border-radius:22px;padding:6px 8px;display:flex;gap:4px;align-items:flex-end;background:var(--bg);box-shadow:0 4px 20px var(--shadow);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--brand);box-shadow:0 4px 24px #00000022}
#prompt{flex:1;min-height:40px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 8px;line-height:1.4}
.send{background:var(--brand);color:#fff;font-weight:700;border-radius:16px;min-width:40px;height:40px;padding:0;border-color:var(--brand);font-size:16px}
.send:hover{background:var(--brand-h)}
.send.stop{background:var(--danger);border-color:var(--danger)}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
.mode-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:2px 8px;border-radius:20px;background:var(--panel);margin-bottom:4px}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px;animation:fadeUp .15s ease}
.modal{width:min(520px,100%);max-height:90dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0004}
.modal h2{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.primary:hover{opacity:.9}
.notice{font-size:12px;color:var(--muted);background:var(--panel);border-radius:11px;padding:10px 12px;line-height:1.4}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{background:transparent;border:0;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.tabs button.active{background:var(--panel);color:var(--text)}
.hidden{display:none!important}
.prev-wrap{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;padding:16px}
.prev-box{width:min(900px,100%);height:min(80dvh,700px);background:var(--bg);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.prev-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.prev-bar button{padding:6px 12px;font-size:13px}
.prev{flex:1;width:100%;border:0;background:#fff}
.mobile-only{display:none}
.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:3}
@media(max-width:720px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,85vw);transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 24px #0003}
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .mobile-only{display:inline-flex}
  .chat{padding:14px 10px}
  .welcome{margin-top:6vh}
  .welcome h1{font-size:22px}
  .suggestions{grid-template-columns:1fr}
  .composer-wrap{padding-left:8px;padding-right:8px}
  .msg-actions{opacity:1}
  .history-item .del{opacity:1}
}

:root{--ease:cubic-bezier(.22,.61,.36,1)}
html{-webkit-tap-highlight-color:transparent}
button{transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease),opacity .18s var(--ease)}
.suggestions button{transition:border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
.chat{scroll-behavior:auto;overscroll-behavior:contain}
.message{animation:fadeUp .32s var(--ease) both}
.message.static{animation:none}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.97)}to{opacity:1;transform:none}}
.modal-backdrop,.prev-wrap{animation:fadeIn .2s var(--ease)}
.modal,.prev-box{animation:popIn .26s var(--ease)}
.cursor{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
@media(max-width:720px){.sidebar{transition:transform .32s var(--ease);will-change:transform}.overlay{display:block;opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}.overlay.show{opacity:1;visibility:visible}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}
.ic.sm{width:15px;height:15px}
.iconbtn{color:var(--muted)}.iconbtn:hover{color:var(--text)}.iconbtn:active{transform:scale(.92)}
#imageBtn:hover{color:var(--brand)}
#themeBtn .ic,#settingsBtn .ic{transition:transform .45s var(--ease)}#themeBtn:hover .ic{transform:rotate(25deg)}#settingsBtn:hover .ic{transform:rotate(90deg)}
.send{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 2px 10px #00000055}
.send:active{transform:scale(.92)}.send .ic{width:19px;height:19px;stroke-width:2.4}.send.stop{box-shadow:0 2px 10px #0003}
.newchat{display:flex;align-items:center;gap:8px}
.searchwrap{position:relative}.searchwrap .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}.searchwrap .search-box{padding-left:33px}
.msg-actions button{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px}
.codehead button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:11.5px}
.history-item .del{display:inline-flex;align-items:center;justify-content:center;padding:8px}
.prev-bar button{display:inline-flex;align-items:center;gap:6px}
@keyframes micPulse{0%{box-shadow:0 0 0 0 #00000077}100%{box-shadow:0 0 0 14px #00000000}}
#micBtn.listening{color:#fff;background:var(--brand);border-color:var(--brand);animation:micPulse 1.2s ease-out infinite}
@media(hover:none){.msg-actions{opacity:1}}

/* ===== Claude-style theme ===== */
:root{--bg:#faf9f5;--panel:#f0eee6;--text:#1f1e1d;--muted:#85837c;--line:#e6e3d8;--bubble:#efece3;--code-bg:#f4f2ea;--card:#fff;--shadow:rgba(70,50,25,.09);--serif:ui-serif,'Iowan Old Style','Charter','Georgia','Noto Serif',serif}

body{font-size:16.5px}

.logo,.brand .sub{display:none}
.brand{font-family:var(--serif);font-size:18px;font-weight:600;text-align:center}

.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.modal{border-radius:22px}
.message{margin-bottom:22px}

.codeblock{background:var(--code-bg);color:var(--text);border-radius:16px}
.codehead{background:transparent;border-bottom:1px solid var(--line);color:var(--muted);padding:7px 8px 7px 14px}
.codehead button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:9px}
.codehead button:hover{border-color:var(--brand);background:var(--card)}
.codehead .run-btn{background:var(--brand);border-color:var(--brand);color:#fff}
.t-c{color:#9a988f}.t-s{color:#4a7c3f}.t-n{color:#555555}.t-k{color:#000000}.t-t{color:#2f6da3}
[data-theme="dark"] .t-c{color:#8d8a80}[data-theme="dark"] .t-s{color:#a5d6a7}[data-theme="dark"] .t-n{color:#d0d0d0}[data-theme="dark"] .t-k{color:#ffffff}[data-theme="dark"] .t-t{color:#8ab4f8}
.ic.xl{width:46px;height:46px}
.welcome{margin-top:6vh}
.welcome .biglogo{background:none!important;box-shadow:none!important;color:var(--brand);width:auto;height:auto;margin-bottom:12px}
.welcome h1{font-family:var(--serif);font-weight:500;font-size:33px;line-height:1.15;margin-bottom:6px}
.suggestions{grid-template-columns:1fr;gap:0;text-align:left;margin-top:26px}
.suggestions button{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 4px;display:flex;align-items:center;gap:13px;font-size:16.5px;transform:none!important}
.suggestions button:first-child{border-top:0}.suggestions button:hover{background:transparent;color:var(--brand)}
.suggestions button .ic{color:var(--muted)}.suggestions b{font-weight:600;display:block}.suggestions i{font-style:normal;color:var(--muted);font-size:13px;display:block}
.composer-wrap{padding:6px 12px calc(8px + env(safe-area-inset-bottom))}
.composer{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"ta ta ta ta" "img . mic send";align-items:center;gap:2px 6px;border-radius:26px;padding:12px 12px 8px 16px;background:var(--card);box-shadow:0 4px 22px var(--shadow)}
#prompt{grid-area:ta;padding:2px 2px 10px;min-height:32px;font-size:17px}
#imageBtn{grid-area:img;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;min-width:36px}
#micBtn{grid-area:mic}.send{grid-area:send;width:38px;height:38px;min-width:38px}
.newchat{background:transparent;color:var(--brand);border-color:transparent;font-weight:700;padding:10px 12px}

.search-box{border-radius:13px}
.sec{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 12px 2px}
.dotbtn{width:32px;height:32px;min-width:0;padding:0;border-radius:50%;border:0;margin-right:12px}.dotbtn.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}

[data-theme="dark"] .dotbtn[data-acc="ink"]{background:#cfcdc4!important;color:#cfcdc4!important}
</style>

<body>
<div class="app" id="app">
  <header>
    <button class="iconbtn mobile-only" id="menuBtn" aria-label="Menu" title="Menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div class="logo">AI</div>
    <div class="brand">Apna AI<div class="sub">Grok-style · Advanced</div></div>
    <button class="iconbtn" id="newChatTop" title="New chat (Ctrl+N)" aria-label="New chat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
  </header>
  <div class="overlay" id="overlay"></div>

function hl(code,lang){const hash=/^(py|python|sh|bash|shell|yaml|yml|ruby|rb|toml)$/.test(lang),markup=/^(html|xml|svg|jsx|tsx|vue)$/.test(lang);const src=String.raw`(\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->`+(markup?'':String.raw`|\/\/[^\n]*`)+(hash?String.raw`|#[^\n]*`:'')+String.raw`)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\x60(?:\\.|[^\x60\\])*\x60)|(\b\d+(?:\.\d+)?\b)|\b(`+KW+String.raw`)\b|(`+(markup?String.raw`<\/?[A-Za-z][\w-]*`:'(?!)')+')';const re=new RegExp(src,'g');let out='',last=0,m;while((m=re.exec(code))){out+=esc(code.slice(last,m.index));const k=m[1]!==undefined?'c':m[2]!==undefined?'s':m[3]!==undefined?'n':m[4]!==undefined?'k':'t';out+='<span class="t-'+k+'">'+esc(m[0])+'</span>';last=re.lastIndex;if(m[0]==='')re.lastIndex++}return out+esc(code.slice(last))}

function renderMd(text){if(!text)return'';const parts=text.split(/(```[\s\S]*?```)/g);return parts.map(part=>{if(part.startsWith('```')){const m=part.match(/^```(\w*)\n?([\s\S]*?)```$/);if(!m)return'<div class="md">'+esc(part)+'</div>';const lang=(m[1]||'').toLowerCase(),code=m[2].replace(/\n$/,'');const canPreview=/^(html|svg)$/.test(lang);return`<div class="codeblock"><div class="codehead"><span class="lang">${esc(lang||'code')}</span><span><button class="copy-btn">${ic('copy','sm')}<span>Copy</span></button>${canPreview?'<button class="run-btn">'+ic('play','sm')+'<span>Preview</span></button>':''}</span></div><pre><code>${hl(code,lang)}</code></pre></div>`}let html='';const lines=part.split('\n');let i=0;while(i<lines.length){const line=lines[i];if(line.includes('|')&&i+1<lines.length&&/^\s*\|?[\s-:|]+/.test(lines[i+1])){const tableRows=[];while(i<lines.length&&lines[i].includes('|')){const cells=lines[i].replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());if(/^\s*[-:]+/.test(cells.join(''))){i++;continue}tableRows.push(cells);i++}if(tableRows.length){html+='<table><thead><tr>'+tableRows[0].map(c=>'<th>'+parseInline(c)+'</th>').join('')+'</tr></thead><tbody>';tableRows.slice(1).forEach(r=>{html+='<tr>'+r.map(c=>'<td>'+parseInline(c)+'</td>').join('')+'</tr>'});html+='</tbody></table>'}continue}const hm=line.match(/^(#{1,3})\s+(.+)/);if(hm){html+=`<h${hm[1].length}>`+parseInline(hm[2])+`</h${hm[1].length}>`;i++;continue}if(/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){html+='<hr>';i++;continue}if(line.startsWith('> ')){html+='<blockquote>'+parseInline(line.slice(2))+'</blockquote>';i++;continue}if(/^[-*]\s+/.test(line)||/^\d+\.\s+/.test(line)){const ordered=/^\d+\./.test(line);html+=ordered?'<ol>':'<ul>';while(i<lines.length&&(/^[-*]\s+/.test(lines[i])||/^\d+\.\s+/.test(lines[i]))){const item=lines[i].replace(/^[-*]\s+/,'').replace(/^\d+\.\s+/,'');html+='<li>'+parseInline(item)+'</li>';i++}html+=ordered?'</ol>':'</ul>';continue}if(line.trim()===''){i++;continue}let para=line;i++;while(i<lines.length&&lines[i].trim()&&!lines[i].startsWith('#')&&!lines[i].startsWith('>')&&!/^[-*]\s+/.test(lines[i])&&!/^\d+\.\s+/.test(lines[i])&&!lines[i].includes('|')&&!/^(-{3,}|\*{3,})$/.test(lines[i].trim())){para+=' '+lines[i];i++}html+='<p>'+parseInline(para)+'</p>'}return'<div class="md">'+html+'</div>'}).join('')}

function SYS(){const lang=settings.language==='auto'?"Reply in the user's language (Hindi, Hinglish or English).":'Reply in '+settings.language+'.';const modeP=MODES[settings.mode]?.prompt||MODES.grok.prompt;return modeP+' '+lang+' SPEED RULE: Answer fast and directly. For normal questions, start with the answer and keep it concise (usually 2–6 sentences); avoid unnecessary introductions and repetition. Expand only when the user asks for detail or the task needs it. For coding tasks, still provide complete working code in fenced blocks with language tags and no placeholders; prefer single-file solutions when practical.'}
function speakText(text){if(!('speechSynthesis' in window)){alert('इस ब्राउज़र में voice reply उपलब्ध नहीं है।');return}window.speechSynthesis.cancel();const clean=String(text||'').replace(/_\((Local|Online) AI\)_/g,'');const u=new SpeechSynthesisUtterance(clean);u.lang=settings.language==='English'?'en-IN':'hi-IN';u.rate=1.03;window.speechSynthesis.speak(u)}
function needsOnline(text){return text.length>220||/(write|build|create|code|coding|program|website|app|html|javascript|python|debug|analy[sz]e|compare|step by step|detail|research|latest|current|today|news|generate image|image|पूरा कोड|कोड बनाओ|ऐप बनाओ|वेबसाइट|विस्तार से|तुलना|आज की खबर|लेटेस्ट)/i.test(text)}
async function getLocalEngine(){if(localEngine)return localEngine;if(!navigator.gpu)throw new Error('इस डिवाइस/ब्राउज़र में WebGPU उपलब्ध नहीं है।');if(!localEnginePromise){localEnginePromise=(async()=>{const mod=await import('https://esm.run/@mlc-ai/web-llm');const engine=await mod.CreateMLCEngine(settings.localModel||'Llama-3.2-1B-Instruct-q4f16_1-MLC',{initProgressCallback:p=>{const el=document.getElementById('routeStatus');if(el)el.textContent='Local AI डाउनलोड/लोड हो रहा है: '+Math.round((p.progress||0)*100)+'%'}});localEngine=engine;return engine})().catch(e=>{localEnginePromise=null;throw e})}return localEnginePromise}
async function send(text){text=(text??$('prompt').value).trim();if(!text||busy)return;$('prompt').value='';$('prompt').style.height='auto';addMessage('user',text);setBusy(true);const c=activeChat();const recent=c.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-12);const history=[{role:'system',content:SYS()+buildLearningContext(text)},...recent.map(m=>({role:m.role,content:m.content}))];const msg={role:'assistant',content:''};c.messages.push(msg);renderChat();const box=[...$('chat').querySelectorAll('.message.assistant .content')].pop();abortCtrl=new AbortController();let raf=0;const paint=()=>{raf=0;const ch=$('chat');const near=ch.scrollHeight-ch.scrollTop-ch.clientHeight<140;box.innerHTML=renderMd(msg.content)+'<span class="cursor"></span>';bindCodeActions(box);if(near)ch.scrollTop=ch.scrollHeight};const schedule=()=>{if(!raf)raf=requestAnimationFrame(paint)};try{let route=settings.aiRoute||'hybrid';if(route==='hybrid')route=needsOnline(text)&&settings.apiKey?'online':'local';if(route==='local'){try{const el=document.getElementById('routeStatus');if(el)el.textContent='Local AI शुरू हो रहा है…';const engine=await getLocalEngine();const result=await engine.chat.completions.create({messages:history,temperature:Number(settings.temperature)||0.3,max_tokens:Math.min(Number(settings.maxTokens)||1024,2048)});msg.content=(result.choices?.[0]?.message?.content||'मुझे जवाब नहीं मिला।')+'\n\n_(Local AI)_';if(el)el.textContent='Local AI तैयार है';}catch(localErr){if(!settings.apiKey)throw new Error('Local AI चालू नहीं हो पाया: '+localErr.message+' — Settings में Online API key डालें या WebGPU समर्थित Chrome/HTTPS पर खोलें।');const el=document.getElementById('routeStatus');if(el)el.textContent='Local AI उपलब्ध नहीं; Online AI पर जा रहे हैं…';route='online'}}if(route==='online'){if(!settings.apiKey)throw new Error('इस सवाल के लिए Online AI चाहिए। Settings में API key जोड़ें, या AI mode को Local only करें।');const response=await fetch(settings.apiBase.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.chatModel,messages:history,temperature:Number(settings.temperature)||0.3,max_tokens:Math.min(Number(settings.maxTokens)||2048,4096),stream:true}),signal:abortCtrl.signal});if(!response.ok){let d={};try{d=await response.json()}catch(_){}throw new Error(d.error?.message||'API error ('+response.status+')')}if(!response.body){const d=await response.json();msg.content=d.choices?.[0]?.message?.content||''}else{const reader=response.body.getReader(),dec=new TextDecoder();let buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){const s=line.trim();if(!s.startsWith('data:'))continue;const data=s.slice(5).trim();if(data==='[DONE]')continue;try{const j=JSON.parse(data);const delta=j.choices?.[0]?.delta?.content||'';if(delta){msg.content+=delta;schedule()}}catch(_){}}}}msg.content+='\n\n_(Online AI)_'}if(raf)cancelAnimationFrame(raf);box.innerHTML=renderMd(msg.content);bindCodeActions(box);c.updated=Date.now();save();if(settings.voiceReplies&&msg.content)speakText(msg.content)}catch(err){if(err.name==='AbortError'){msg.content=(msg.content||'')+'\n\n*(stopped)*'}else{msg.content='⚠️ Error: '+(err.message||String(err))}if(raf)cancelAnimationFrame(raf);box.innerHTML=renderMd(msg.content);save()}finally{setBusy(false);abortCtrl=null}}
function stopGen(){if(abortCtrl)abortCtrl.abort()}
async function regenerate(msgIdx){const c=activeChat();if(!c||busy)return;let userIdx=msgIdx-1;while(userIdx>=0&&c.messages[userIdx].role!=='user')userIdx--;if(userIdx<0)return;const userText=c.messages[userIdx].content;c.messages=c.messages.slice(0,userIdx);save();renderChat();await send(userText)}
function generateImage(){const root=$('modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>Generate Image</h2>${settings.apiKey?'':'<div class="notice">Free mode: API key nahi hai, isliye free Pollinations service use hogi. Thodi slow ho sakti hai aur rate limit (15 sec mein 1 image) ya watermark lag sakta hai. English prompt se behtar result milta hai.</div>'}<div class="field"><label>Prompt</label><textarea id="imagePrompt" rows="3" placeholder="Describe the image…"></textarea></div><div class="field"><label>Size</label><select id="imageSize"><option value="1024x1024">Square (1024×1024)</option><option value="1536x1024">Landscape (1536×1024)</option><option value="1024x1536">Portrait (1024×1536)</option></select></div><div class="rowbtn"><button class="primary" id="doGen">Generate</button><button id="closeImg">Cancel</button></div></div></div>`;$('closeImg').onclick=()=>root.innerHTML='';$('imagePrompt').focus();$('doGen').onclick=async()=>{const prompt=$('imagePrompt').value.trim(),size=$('imageSize').value;if(!prompt){$('imagePrompt').focus();return}root.innerHTML='';addMessage('user','Create an image: '+prompt);setBusy(true);const c=activeChat();const msg={role:'assistant',content:'Generating image…'};c.messages.push(msg);renderChat();try{if(!settings.apiKey){const[w0,h0]=size.split('x').map(Number),k=1024/Math.max(w0,h0),w=Math.round(w0*k),h=Math.round(h0*k);const u='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width='+w+'&height='+h+'&seed='+Math.floor(Math.random()*1e6)+'&nologo=true&model=flux';await new Promise((res,rej)=>{const im=new Image();const t=setTimeout(()=>rej(new Error('Free service ne time out kiya. Thodi der baad dobara try karo.')),90000);im.onload=()=>{clearTimeout(t);res()};im.onerror=()=>{clearTimeout(t);rej(new Error('Free image service abhi available nahi hai ya rate limit lag gaya (15 sec mein 1 image). Thodi der baad try karo, ya Settings mein API key daalo.'))};im.src=u});msg.image=u;msg.content='Here is your image (free mode):';save();renderChat();return}const r=await fetch(settings.apiBase.replace(/\/$/,'')+'/images/generations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.imageModel,prompt,size,n:1})});if(!r.ok){let d={};try{d=await r.json()}catch(_){}throw new Error(d.error?.message||'Image API error ('+r.status+')')}const d=await r.json();const b64=d.data?.[0]?.b64_json,url=d.data?.[0]?.url;if(b64)msg.image='data:image/png;base64,'+b64;else if(url)msg.image=url;else throw new Error('No image in response');msg.content='Here is your image:';save();renderChat()}catch(err){msg.content='⚠️ Image error: '+err.message;save();renderChat()}finally{setBusy(false)}}}
function showSettings(){const root=$('modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>Settings</h2><div class="tabs"><button class="active" data-tab="api">API</button><button data-tab="model">Model</button><button data-tab="prefs">Prefs</button></div><div id="tab-api"><div class="notice">Hybrid AI: आसान सवाल Local AI पर; कठिन सवाल Online AI पर। API key इस browser में रहती है—public app के लिए secure backend जरूरी है.</div><div class="notice" id="routeStatus">Local AI अभी लोड नहीं हुआ। पहली बार model download होने में समय और storage लग सकता है.</div><div class="field"><label>API base URL</label><input id="apiBase" value="${esc(settings.apiBase)}" placeholder="https://api.openai.com/v1"></div><div class="field"><label>API key</label><input id="apiKey" type="password" value="${esc(settings.apiKey)}" placeholder="sk-…"></div></div><div id="tab-model" class="hidden"><div class="field"><label>AI routing</label><select id="aiRoute"><option value="hybrid">Hybrid (recommended)</option><option value="local">Local only (offline after model download)</option><option value="online">Online only (API)</option></select></div><div class="field"><label>Local model (WebGPU)</label><select id="localModel"><option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (smaller/faster)</option><option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (better, needs more RAM)</option></select><button id="loadLocal" style="margin-top:8px">Download / Load Local AI</button></div><div class="field"><label>Chat model</label><input id="chatModel" value="${esc(settings.chatModel)}"></div><div class="field"><label>Image model</label><input id="imageModel" value="${esc(settings.imageModel)}"></div><div class="field"><label>Temperature (0–2)</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="${settings.temperature}"></div><div class="field"><label>Max tokens</label><input id="maxTokens" type="number" min="256" max="128000" step="256" value="${settings.maxTokens}"></div><div class="field"><label>System mode</label><select id="mode"><option value="grok">Grok-style (full knowledge)</option><option value="coding">Coding Expert</option><option value="creative">Creative</option><option value="concise">Concise</option></select></div></div><div id="tab-prefs" class="hidden"><div class="field"><label>Language preference</label><select id="language"><option value="auto">Auto-detect</option><option value="Hindi">Hindi</option><option value="English">English</option></select></div><div class="field"><label>Voice replies</label><select id="voiceReplies"><option value="true">Speak answers aloud</option><option value="false">Text only</option></select></div><div class="field"><label>Theme</label><select id="themeSel"><option value="auto">Auto (system)</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="field"><label>Chat font</label><select id="fontSel"><option value="serif">Serif (Claude-style)</option><option value="sans">Sans</option></select></div><div class="field"><label>Text size</label><select id="sizeSel"><option value="sm">Small</option><option value="md">Medium</option><option value="lg">Large</option></select></div><div class="field"><label>Accent colour</label><div id="accentDots"><button class="dotbtn" data-acc="terracotta" style="background:#111111;color:#111111;box-shadow:inset 0 0 0 1px #888"></button><button class="dotbtn" data-acc="indigo" style="background:#5b6cd6;color:#5b6cd6"></button><button class="dotbtn" data-acc="green" style="background:#4f8f5b;color:#4f8f5b"></button><button class="dotbtn" data-acc="plum" style="background:#8f4f8a;color:#8f4f8a"></button><button class="dotbtn" data-acc="ink" style="background:#3a3835;color:#3a3835"></button></div></div><div class="notice">Learning memory: jawab par ✦ Learn dabakar Q&A save karein. Apna AI un saved notes ko relevant sawalon mein use karega. Yeh model ko automatically train nahi karta.</div><div class="field"><label>Use saved learning</label><select id="useLearning"><option value="true">On</option><option value="false">Off</option></select></div><div class="field"><label>Community learning server URL (optional)</label><input id="communityEndpoint" placeholder="https://your-server.example" value="${esc(settings.communityEndpoint||'')}"></div><div class="field"><label>Share saved notes for community review</label><select id="shareLearning"><option value="false">Off (recommended)</option><option value="true">On — only when I press Learn</option></select><button id="syncLearning" style="margin-top:8px">Sync approved community learning</button><div style="font-size:12px;color:var(--muted);margin-top:6px">Shared learning ke liye alag backend server chahiye. Notes pehle review queue mein jaate hain; doosron ki notes sync karne par hi aapke app mein aayengi.</div></div><div class="rowbtn" style="margin-top:8px"><button id="exportChat">Export current chat (Markdown)</button><button id="clearAll">Clear all chats</button><button id="clearLearning">Clear learning memory (${learned.length})</button></div></div><div class="rowbtn"><button class="primary" id="saveSettings">Save</button><button id="clearKey">Remove API key</button><button id="closeSettings">Close</button></div></div></div>`;root.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{root.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['api','model','prefs'].forEach(t=>{const el=root.querySelector('#tab-'+t);if(el)el.classList.toggle('hidden',t!==b.dataset.tab)})}});$('language').value=settings.language;$('mode').value=settings.mode||'grok';$('themeSel').value=settings.theme;$('fontSel').value=settings.font||'serif';$('sizeSel').value=settings.size||'md';['themeSel','fontSel','sizeSel'].forEach(id=>$(id).addEventListener('change',()=>{settings.theme=$('themeSel').value;settings.font=$('fontSel').value;settings.size=$('sizeSel').value;saveSettings()}));root.querySelectorAll('#accentDots .dotbtn').forEach(b=>{b.classList.toggle('sel',b.dataset.acc===(settings.accent||'terracotta'));b.onclick=()=>{settings.accent=b.dataset.acc;saveSettings();root.querySelectorAll('#accentDots .dotbtn').forEach(x=>x.classList.toggle('sel',x===b))}});$('useLearning').value=String(settings.useLearning!==false);$('shareLearning').value=String(settings.shareLearning===true);$('communityEndpoint').value=settings.communityEndpoint||'';$('syncLearning').onclick=syncCommunityLearning;$('clearLearning').onclick=()=>{if(confirm('Saari saved learning memory delete karein?')){learned=[];saveLearned();alert('Learning memory cleared. Settings dobara kholen to updated count dikhega.')}};$('voiceReplies').value=String(settings.voiceReplies!==false);$('aiRoute').value=settings.aiRoute||'hybrid';$('localModel').value=settings.localModel||'Llama-3.2-1B-Instruct-q4f16_1-MLC';$('loadLocal').onclick=async()=>{try{$('routeStatus').textContent='Local AI model डाउनलोड/लोड हो रहा है…';await getLocalEngine();$('routeStatus').textContent='Local AI तैयार है। अगली बार यह cache से लोड हो सकता है.';alert('Local AI तैयार है!')}catch(e){$('routeStatus').textContent='Local AI error: '+e.message;alert('Local AI चालू नहीं हुआ: '+e.message)}};$('closeSettings').onclick=()=>root.innerHTML='';$('saveSettings').onclick=()=>{settings.apiBase=$('apiBase').value.trim()||'https://api.openai.com/v1';settings.apiKey=$('apiKey').value.trim();settings.chatModel=$('chatModel').value.trim()||'gpt-4o-mini';settings.imageModel=$('imageModel').value.trim()||'gpt-image-1';settings.temperature=parseFloat($('temperature').value)||0.5;settings.maxTokens=parseInt($('maxTokens').value)||2048;settings.mode=$('mode').value;settings.language=$('language').value;settings.theme=$('themeSel').value;settings.voiceReplies=$('voiceReplies').value==='true';settings.aiRoute=$('aiRoute').value;settings.localModel=$('localModel').value;settings.useLearning=$('useLearning').value==='true';settings.shareLearning=$('shareLearning').value==='true';settings.communityEndpoint=$('communityEndpoint').value.trim().replace(/\/$/,'');saveSettings();root.innerHTML=''};$('clearKey').onclick=()=>{$('apiKey').value='';settings.apiKey='';saveSettings()};$('exportChat').onclick=()=>{const c=activeChat();if(!c||!c.messages.length){alert('No chat to export');return}let md='# '+c.title+'\n\n';c.messages.forEach(m=>{md+='## '+(m.role==='user'?'You':'Apna AI')+'\n\n'+(m.content||'')+'\n\n'});const blob=new Blob([md],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(c.title||'chat').replace(/[^\w\-]+/g,'_').slice(0,40)+'.md';a.click()};$('clearAll').onclick=()=>{if(!confirm('Delete ALL chats? This cannot be undone.'))return;chats=[];currentId=null;save();renderChat();root.innerHTML=''}}
$('sendBtn').onclick=()=>{if(busy)stopGen();else send()};
$('newChat').onclick=newChat;$('newChatTop').onclick=newChat;$('settingsBtn').onclick=showSettings;
$('themeBtn').onclick=()=>{settings.theme=resolveTheme()==='dark'?'light':'dark';saveSettings()};
$('imageBtn').onclick=generateImage;
$('menuBtn').onclick=()=>{if($('sidebar').classList.contains('open'))closeSidebar();else openSidebar()};
$('overlay').onclick=closeSidebar;
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!busy)send()}if(e.key==='Escape'&&busy)stopGen()});
$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'});
$('searchChats').addEventListener('input',e=>{searchQ=e.target.value;renderHistory()});
$('micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input needs Chrome on Android.');return}const rec=new SR();rec.lang=settings.language==='Hindi'?'hi-IN':settings.language==='English'?'en-IN':'hi-IN';rec.interimResults=false;rec.onstart=()=>$('micBtn').classList.add('listening');rec.onend=()=>$('micBtn').classList.remove('listening');rec.onresult=e=>{const spoken=e.results[0][0].transcript;$('prompt').value=spoken;$('prompt').dispatchEvent(new Event('input'));send(spoken)};rec.onerror=e=>alert('Voice error: '+e.error);rec.start()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();newChat()}if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();showSettings()}});
applyTheme();updateModePill();renderHistory();renderChat();
if(settings.communityEndpoint){syncCommunityLearning(true);setInterval(()=>{if(document.visibilityState==='visible')syncCommunityLearning(true)},15*60*1000)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
